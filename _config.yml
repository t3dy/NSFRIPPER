title: ReapNES Studio
description: NES game music extracted to MIDI with per-frame APU register fidelity
url: https://t3dy.github.io
baseurl: /NSFRIPPER
remote_theme: pages-themes/slate@v0.2.0

plugins:
  - jekyll-remote-theme

exclude:
  - extraction/
  - ANTIRIPPER/
  - scripts/
  - studio/
  - state/
  - roms/
  - templates/
  - "*.py"
  - "*.pyc"
  - py65/
  - __pycache__/
  - .claude/
  - node_modules/
  - BESTOUTPUT/
  - Gemfile
  - Gemfile.lock

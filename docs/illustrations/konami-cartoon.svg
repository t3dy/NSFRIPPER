<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef6e4"/>
      <stop offset="100%" stop-color="#c3bef0"/>
    </linearGradient>
    <marker id="arrow3" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#3d348b"/>
    </marker>
    <style>
      .title { font: 700 44px 'Trebuchet MS', sans-serif; fill: #2b2d42; }
      .subtitle { font: 600 22px 'Trebuchet MS', sans-serif; fill: #5a189a; }
      .small { font: 700 24px 'Trebuchet MS', sans-serif; fill: #2b2d42; }
      .body { font: 500 18px 'Trebuchet MS', sans-serif; fill: #2f3e46; }
      .cap { font: 700 20px 'Trebuchet MS', sans-serif; fill: #ffffff; }
      .box { fill: #ffffff; stroke: #3d348b; stroke-width: 4; rx: 24; ry: 24; }
      .arrow { stroke: #3d348b; stroke-width: 8; fill: none; marker-end: url(#arrow3); stroke-linecap: round; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg3)"/>
  <text x="800" y="82" text-anchor="middle" class="title">Konami Driver Breakthroughs</text>
  <text x="800" y="120" text-anchor="middle" class="subtitle">Castlevania and Contra as the repo's most successful reverse-engineering training montage</text>

  <rect x="170" y="220" width="300" height="180" class="box"/>
  <rect x="530" y="220" width="300" height="180" class="box"/>
  <rect x="890" y="220" width="300" height="180" class="box"/>
  <rect x="410" y="500" width="780" height="200" class="box"/>

  <rect x="260" y="238" width="120" height="34" rx="17" fill="#e63946"/>
  <text x="320" y="262" text-anchor="middle" class="cap">READ</text>
  <text x="320" y="316" text-anchor="middle" class="small">Disassembly first</text>
  <text x="320" y="348" text-anchor="middle" class="body">DX bytes</text>
  <text x="320" y="374" text-anchor="middle" class="body">Loop semantics</text>

  <rect x="620" y="238" width="120" height="34" rx="17" fill="#f4a261"/>
  <text x="680" y="262" text-anchor="middle" class="cap">CHECK</text>
  <text x="680" y="316" text-anchor="middle" class="small">Dump the trace</text>
  <text x="680" y="348" text-anchor="middle" class="body">Pitch before volume</text>
  <text x="680" y="374" text-anchor="middle" class="body">One test at a time</text>

  <rect x="980" y="238" width="120" height="34" rx="17" fill="#2a9d8f"/>
  <text x="1040" y="262" text-anchor="middle" class="cap">GENERALIZE</text>
  <text x="1040" y="316" text-anchor="middle" class="small">Cross-game wins</text>
  <text x="1040" y="348" text-anchor="middle" class="body">CV1 fixes Contra</text>
  <text x="1040" y="374" text-anchor="middle" class="body">Contra reveals CV1 bugs</text>

  <rect x="720" y="518" width="160" height="34" rx="17" fill="#4361ee"/>
  <text x="800" y="542" text-anchor="middle" class="cap">RESULT</text>
  <text x="800" y="592" text-anchor="middle" class="small">Near-zero mismatch workflow</text>
  <text x="800" y="624" text-anchor="middle" class="body">Parser emits full-duration events.</text>
  <text x="800" y="650" text-anchor="middle" class="body">Frame IR handles envelopes.</text>
  <text x="800" y="676" text-anchor="middle" class="body">Method beats guessing.</text>

  <path d="M470 310 C500 310, 500 310, 530 310" class="arrow"/>
  <path d="M830 310 C860 310, 860 310, 890 310" class="arrow"/>
  <path d="M1040 400 C1040 470, 900 490, 860 530" class="arrow"/>
  <path d="M320 400 C320 470, 610 480, 720 530" class="arrow"/>

  <g transform="translate(160,560)">
    <ellipse cx="0" cy="112" rx="88" ry="26" fill="#000000" opacity="0.12"/>
    <circle cx="-28" cy="34" r="48" fill="#d90429" stroke="#2b2d42" stroke-width="4"/>
    <circle cx="28" cy="34" r="48" fill="#f77f00" stroke="#2b2d42" stroke-width="4"/>
    <circle cx="-42" cy="22" r="6" fill="#2b2d42"/>
    <circle cx="-14" cy="22" r="6" fill="#2b2d42"/>
    <circle cx="14" cy="22" r="6" fill="#2b2d42"/>
    <circle cx="42" cy="22" r="6" fill="#2b2d42"/>
    <path d="M-44 48 Q-28 60 -12 48" stroke="#2b2d42" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M12 48 Q28 60 44 48" stroke="#2b2d42" stroke-width="5" fill="none" stroke-linecap="round"/>
    <text x="120" y="28" class="small">Castlevania + Contra</text>
    <text x="120" y="58" class="body">two cartoon lab partners</text>
    <text x="120" y="88" class="body">teaching the same system</text>
    <text x="120" y="114" class="body">from different angles</text>
  </g>
</svg>

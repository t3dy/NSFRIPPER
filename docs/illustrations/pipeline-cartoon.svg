<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff6cf"/>
      <stop offset="100%" stop-color="#b9ecff"/>
    </linearGradient>
    <marker id="arrow1" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#124559"/>
    </marker>
    <filter id="shadow1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#124559" flood-opacity="0.18"/>
    </filter>
    <style>
      .title { font: 700 44px 'Trebuchet MS', sans-serif; fill: #12343b; }
      .subtitle { font: 600 22px 'Trebuchet MS', sans-serif; fill: #235789; }
      .box { fill: #ffffff; stroke: #124559; stroke-width: 4; rx: 24; ry: 24; filter: url(#shadow1); }
      .small { font: 700 24px 'Trebuchet MS', sans-serif; fill: #12343b; }
      .body { font: 500 18px 'Trebuchet MS', sans-serif; fill: #203239; }
      .cap { font: 700 20px 'Trebuchet MS', sans-serif; fill: #ffffff; }
      .arrow { stroke: #124559; stroke-width: 8; fill: none; marker-end: url(#arrow1); stroke-linecap: round; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg1)"/>
  <circle cx="1470" cy="120" r="80" fill="#ffd166" opacity="0.85"/>
  <circle cx="130" cy="120" r="56" fill="#ffffff" opacity="0.7"/>
  <circle cx="210" cy="95" r="40" fill="#ffffff" opacity="0.7"/>
  <circle cx="260" cy="125" r="52" fill="#ffffff" opacity="0.7"/>

  <text x="800" y="84" text-anchor="middle" class="title">Core Pipeline Architecture</text>
  <text x="800" y="124" text-anchor="middle" class="subtitle">Sunday-morning workflow map for the repo's biggest documentation cluster</text>

  <rect x="90" y="230" width="260" height="180" class="box"/>
  <rect x="410" y="230" width="260" height="180" class="box"/>
  <rect x="730" y="230" width="260" height="180" class="box"/>
  <rect x="1050" y="230" width="260" height="180" class="box"/>
  <rect x="640" y="520" width="320" height="210" class="box"/>

  <rect x="140" y="248" width="160" height="34" rx="17" fill="#ff6b6b"/>
  <text x="220" y="272" text-anchor="middle" class="cap">INGEST</text>
  <text x="220" y="320" text-anchor="middle" class="small">ROM + NSF + Trace</text>
  <text x="220" y="352" text-anchor="middle" class="body">Collect sources</text>
  <text x="220" y="378" text-anchor="middle" class="body">Preserve provenance</text>

  <rect x="460" y="248" width="160" height="34" rx="17" fill="#ff9f1c"/>
  <text x="540" y="272" text-anchor="middle" class="cap">ROUTES</text>
  <text x="540" y="320" text-anchor="middle" class="small">Generate every path</text>
  <text x="540" y="352" text-anchor="middle" class="body">NSF</text>
  <text x="540" y="378" text-anchor="middle" class="body">Trace</text>

  <rect x="780" y="248" width="160" height="34" rx="17" fill="#2ec4b6"/>
  <text x="860" y="272" text-anchor="middle" class="cap">VALIDATE</text>
  <text x="860" y="320" text-anchor="middle" class="small">Ground truth checks</text>
  <text x="860" y="352" text-anchor="middle" class="body">Pitch, timing, volume</text>
  <text x="860" y="378" text-anchor="middle" class="body">Assumption tests</text>

  <rect x="1100" y="248" width="160" height="34" rx="17" fill="#3a86ff"/>
  <text x="1180" y="272" text-anchor="middle" class="cap">REPORT</text>
  <text x="1180" y="320" text-anchor="middle" class="small">Compare + explain</text>
  <text x="1180" y="352" text-anchor="middle" class="body">Manifest evidence</text>
  <text x="1180" y="378" text-anchor="middle" class="body">Block bad delivery</text>

  <rect x="730" y="542" width="140" height="34" rx="17" fill="#8338ec"/>
  <text x="800" y="566" text-anchor="middle" class="cap">RULES = CODE</text>
  <text x="800" y="610" text-anchor="middle" class="small">The big doctrine</text>
  <text x="800" y="642" text-anchor="middle" class="body">No memory-only process</text>
  <text x="800" y="668" text-anchor="middle" class="body">No silent fallback</text>
  <text x="800" y="694" text-anchor="middle" class="body">No mixing truth layers</text>

  <path d="M350 320 C385 320, 385 320, 410 320" class="arrow"/>
  <path d="M670 320 C705 320, 705 320, 730 320" class="arrow"/>
  <path d="M990 320 C1025 320, 1025 320, 1050 320" class="arrow"/>
  <path d="M1180 410 C1180 480, 980 520, 910 560" class="arrow"/>
  <path d="M800 520 C800 470, 860 438, 860 410" class="arrow"/>
  <path d="M640 560 C520 500, 360 466, 260 410" class="arrow"/>

  <g transform="translate(104,640)">
    <ellipse cx="0" cy="70" rx="78" ry="28" fill="#000000" opacity="0.12"/>
    <circle cx="0" cy="0" r="52" fill="#ffd166" stroke="#124559" stroke-width="4"/>
    <circle cx="-18" cy="-10" r="7" fill="#124559"/>
    <circle cx="18" cy="-10" r="7" fill="#124559"/>
    <path d="M-18 18 Q0 36 18 18" stroke="#124559" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M-52 2 Q-88 -20 -102 8" stroke="#124559" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M52 2 Q88 -20 102 8" stroke="#124559" stroke-width="5" fill="none" stroke-linecap="round"/>
    <text x="160" y="14" class="small">Cartoon narrator:</text>
    <text x="160" y="44" class="body">"Try every route, compare them,</text>
    <text x="160" y="70" class="body">and never trust a lucky output."</text>
  </g>
</svg>
